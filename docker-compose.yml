version: "3.9"

services:
  # ── Backend: FastAPI + LibreOffice ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resume-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./templates:/templates:ro
    expose:
      - "8000"
    networks:
      - resume-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend: React/Vite → Nginx ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-net

networks:
  resume-net:
    driver: bridge
